; Development OPcache tuning.
;
; The dev container serves the app with `php artisan serve`, which runs on the
; CLI SAPI — and OPcache is disabled on CLI by default (opcache.enable_cli=0).
; That means every request recompiled every PHP file it touched. The project is
; bind-mounted from Windows, where a single file read costs ~20-30ms and a stat
; ~7-13ms, so recompilation dominated response time far more than any query.
;
; validate_timestamps stays on so edits are still picked up without a restart.
; revalidate_freq caps the (also expensive) stat traffic to once per file per
; 2s, which is the same trade-off the php-apache default already makes.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Laravel + vendor comfortably exceeds the stock 10000-file / 128MB budget once
; every request is actually cached instead of recompiled.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
