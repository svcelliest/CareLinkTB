name: carelink-tb

x-app-environment: &app-environment
    APP_NAME: "CareLink TB"
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: "http://localhost:${CARELINK_APP_PORT:-8000}"
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: carelink_tb
    DB_USERNAME: carelink
    DB_PASSWORD: "${CARELINK_DB_PASSWORD:-carelink}"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: local
    WAIT_FOR_DB: "true"
    AUTO_MIGRATE: "true"

services:
    app:
        build:
            context: .
            target: development
        environment: *app-environment
        command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
        init: true
        ports:
            - "${CARELINK_APP_PORT:-8000}:8000"
        volumes:
            - .:/var/www/html
            - php-vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/up"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 120s

    queue:
        build:
            context: .
            target: development
        environment:
            <<: *app-environment
            AUTO_MIGRATE: "false"
        command: php artisan queue:work --tries=1 --timeout=0
        init: true
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - php-vendor:/var/www/html/vendor
        depends_on:
            app:
                condition: service_healthy
            db:
                condition: service_healthy

    vite:
        image: node:22-alpine
        working_dir: /var/www/html
        environment:
            VITE_SERVER_HOST: 0.0.0.0
            VITE_HMR_HOST: localhost
            VITE_HMR_CLIENT_PORT: "${CARELINK_VITE_PORT:-5173}"
            VITE_USE_POLLING: "true"
        command: >-
            sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
            && npm run dev"
        init: true
        ports:
            - "${CARELINK_VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - node-modules:/var/www/html/node_modules

    test:
        profiles: [test]
        build:
            context: .
            target: development
        environment:
            APP_NAME: "CareLink TB"
            APP_ENV: testing
            APP_DEBUG: "true"
            APP_URL: http://localhost
            LOG_CHANNEL: stderr
            DB_CONNECTION: sqlite
            DB_DATABASE: ":memory:"
            SESSION_DRIVER: array
            CACHE_STORE: array
            QUEUE_CONNECTION: sync
            MAIL_MAILER: array
            FILESYSTEM_DISK: local
            WAIT_FOR_DB: "false"
            AUTO_MIGRATE: "false"
        command: php artisan test
        init: true
        volumes:
            - .:/var/www/html
            - php-vendor:/var/www/html/vendor

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: carelink_tb
            MYSQL_USER: carelink
            MYSQL_PASSWORD: "${CARELINK_DB_PASSWORD:-carelink}"
            MYSQL_ROOT_PASSWORD: "${CARELINK_DB_ROOT_PASSWORD:-carelink-root}"
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        ports:
            - "${CARELINK_DB_PORT:-3307}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    mysql-data:
    node-modules:
    php-vendor:
